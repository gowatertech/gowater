<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Generador de Rutas - Test</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      padding: 20px;
      font-family: system-ui, -apple-system, sans-serif;
    }
    pre {
      background-color: #f8f9fa;
      padding: 15px;
      border-radius: 5px;
      max-height: 400px;
      overflow: auto;
    }
    .result-container {
      margin-top: 20px;
    }
    .order-item {
      border: 1px solid #ddd;
      border-radius: 5px;
      padding: 10px;
      margin-bottom: 10px;
    }
    .zone-tag {
      display: inline-block;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      margin-right: 5px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1 class="mb-4">Generador de Rutas - Herramienta de Prueba</h1>
    
    <div class="row">
      <div class="col-md-6">
        <div class="card mb-4">
          <div class="card-header">
            <h5 class="card-title">Autenticación</h5>
          </div>
          <div class="card-body">
            <form id="loginForm">
              <div class="mb-3">
                <label for="email" class="form-label">Email</label>
                <input type="email" class="form-control" id="email" value="aguamoya@gmail.com">
              </div>
              <div class="mb-3">
                <label for="password" class="form-label">Contraseña</label>
                <input type="password" class="form-control" id="password" value="admin123">
              </div>
              <button type="submit" class="btn btn-primary">Iniciar Sesión</button>
            </form>
            <div id="loginResult" class="mt-3"></div>
          </div>
        </div>
        
        <div class="card mb-4">
          <div class="card-header">
            <h5 class="card-title">Endpoint Test</h5>
          </div>
          <div class="card-body">
            <div class="mb-3">
              <label for="endpoint" class="form-label">Endpoint</label>
              <select class="form-select" id="endpoint">
                <option value="/api/route-generator/orders/pending">Obtener Pedidos Pendientes</option>
                <option value="/api/zones">Obtener Zonas</option>
                <option value="/api/drivers">Obtener Conductores</option>
                <option value="/api/trucks">Obtener Vehículos</option>
              </select>
            </div>
            <button id="testEndpoint" class="btn btn-success">Probar Endpoint</button>
          </div>
        </div>
      </div>
      
      <div class="col-md-6">
        <div class="card">
          <div class="card-header">
            <h5 class="card-title">Resultado</h5>
          </div>
          <div class="card-body">
            <div id="statusResult"></div>
            <div id="rawResponse" class="result-container">
              <h6>Respuesta Raw:</h6>
              <pre id="rawResponseData"></pre>
            </div>
          </div>
        </div>
      </div>
    </div>
    
    <div class="row mt-4">
      <div class="col-12">
        <div class="card">
          <div class="card-header">
            <h5 class="card-title">Pedidos Pendientes</h5>
          </div>
          <div class="card-body">
            <div id="ordersContainer"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const loginForm = document.getElementById('loginForm');
      const loginResult = document.getElementById('loginResult');
      const testEndpointBtn = document.getElementById('testEndpoint');
      const statusResult = document.getElementById('statusResult');
      const rawResponseData = document.getElementById('rawResponseData');
      const ordersContainer = document.getElementById('ordersContainer');
      
      loginForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        
        loginResult.innerHTML = '<div class="alert alert-info">Iniciando sesión...</div>';
        
        try {
          const response = await fetch('/api/login', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json'
            },
            body: JSON.stringify({ email, password })
          });
          
          const data = await response.json();
          
          if (response.ok) {
            loginResult.innerHTML = '<div class="alert alert-success">Sesión iniciada correctamente</div>';
            console.log('Login successful', data);
          } else {
            loginResult.innerHTML = `<div class="alert alert-danger">Error: ${data.message || 'No se pudo iniciar sesión'}</div>`;
            console.error('Login failed', data);
          }
        } catch (error) {
          loginResult.innerHTML = `<div class="alert alert-danger">Error: ${error.message}</div>`;
          console.error('Login error', error);
        }
      });
      
      testEndpointBtn.addEventListener('click', async () => {
        const endpoint = document.getElementById('endpoint').value;
        
        statusResult.innerHTML = '<div class="alert alert-info">Consultando endpoint...</div>';
        rawResponseData.textContent = '';
        ordersContainer.innerHTML = '';
        
        try {
          const response = await fetch(endpoint, {
            credentials: 'include',
            headers: {
              'Cache-Control': 'no-cache',
              'Pragma': 'no-cache'
            }
          });
          
          const responseText = await response.text();
          rawResponseData.textContent = responseText;
          
          if (response.ok) {
            try {
              const data = JSON.parse(responseText);
              statusResult.innerHTML = `<div class="alert alert-success">
                Éxito - Status: ${response.status} ${response.statusText}
              </div>`;
              
              // Si el endpoint es el de pedidos pendientes y hay datos, mostrarlos
              if (endpoint === '/api/route-generator/orders/pending' && Array.isArray(data) && data.length > 0) {
                const ordersHTML = data.map(order => {
                  const customerName = order.customer?.businessname || 'Cliente sin nombre';
                  const address = order.customer ? `${order.customer.street || ''} ${order.customer.streetnumber || ''}` : 'Sin dirección';
                  const zoneColor = order.zone?.color || '#cccccc';
                  const zoneName = order.zone?.name || 'Sin zona';
                  
                  return `
                    <div class="order-item">
                      <div class="d-flex justify-content-between align-items-center mb-2">
                        <h6 class="mb-0">Pedido #${order.id}</h6>
                        <span class="badge bg-secondary">RD$ ${order.total}</span>
                      </div>
                      <p class="mb-1"><strong>Cliente:</strong> ${customerName}</p>
                      <p class="mb-1"><strong>Dirección:</strong> ${address}</p>
                      <p class="mb-1">
                        <strong>Zona:</strong>
                        <span class="zone-tag" style="background-color: ${zoneColor}"></span>
                        ${zoneName}
                      </p>
                      <p class="mb-0"><strong>Fecha:</strong> ${new Date(order.date).toLocaleString()}</p>
                    </div>
                  `;
                }).join('');
                
                ordersContainer.innerHTML = ordersHTML;
              }
            } catch (parseError) {
              console.error('Error parsing JSON', parseError);
            }
          } else {
            statusResult.innerHTML = `<div class="alert alert-danger">
              Error - Status: ${response.status} ${response.statusText}
            </div>`;
          }
        } catch (error) {
          statusResult.innerHTML = `<div class="alert alert-danger">Error: ${error.message}</div>`;
          console.error('Endpoint error', error);
        }
      });
    });
  </script>
</body>
</html>
