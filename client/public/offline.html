<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GoWater Driver - Sin conexión</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      padding: 20px;
      text-align: center;
      background-color: #f8fafc;
      color: #0f172a;
    }
    
    .container {
      max-width: 500px;
      padding: 2rem;
      border-radius: 0.5rem;
      background-color: white;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
    }
    
    .icon {
      width: 64px;
      height: 64px;
      margin-bottom: 1rem;
      color: #2563eb;
    }
    
    h1 {
      font-size: 1.5rem;
      font-weight: 600;
      margin-bottom: 1rem;
      color: #0f172a;
    }
    
    p {
      margin-bottom: 1.5rem;
      color: #475569;
    }
    
    .button {
      display: inline-block;
      padding: 0.5rem 1rem;
      background-color: #2563eb;
      color: white;
      border-radius: 0.25rem;
      font-weight: 500;
      text-decoration: none;
      cursor: pointer;
      transition: background-color 0.2s;
    }
    
    .button:hover {
      background-color: #1d4ed8;
    }
    
    @media (prefers-color-scheme: dark) {
      body {
        background-color: #0f172a;
        color: #f8fafc;
      }
      
      .container {
        background-color: #1e293b;
        box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3), 0 2px 4px -1px rgba(0, 0, 0, 0.2);
      }
      
      h1 {
        color: #f8fafc;
      }
      
      p {
        color: #cbd5e1;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon">
      <path d="M1 1h22v20H1z"></path>
      <path d="M18 10a6 6 0 0 0-12 0"></path>
      <path d="M12 16v2"></path>
    </svg>
    
    <h1>Sin conexión a Internet</h1>
    
    <p>No se puede acceder a GoWater Driver en este momento porque no tienes conexión a Internet. Algunas funcionalidades pueden seguir disponibles en modo offline.</p>
    
    <a href="/" class="button">Intentar de nuevo</a>
  </div>
  
  <script>
    // Comprobar cuando vuelva la conexión
    window.addEventListener('online', () => {
      window.location.reload();
    });
    
    document.querySelector('.button').addEventListener('click', (e) => {
      e.preventDefault();
      window.location.reload();
    });
  </script>
</body>
</html>
